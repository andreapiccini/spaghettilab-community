name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "software/micro-flow-editor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/micro-flow-editor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: software/micro-flow-editor/package-lock.json
      - name: Install
        run: npm ci
      - name: Build demo-only app
        run: npm run build -w @spaghettilab/app
        env:
          VITE_DEMO_ONLY: "1"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: software/micro-flow-editor/packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
