    #backbone-four-indicators{display:grid;gap:.55rem;max-width:670px;margin:auto}

    #backbone-four-indicators svg{display:block;width:100%;height:auto}
    #backbone-four-indicators [hidden]{display:none}
    #backbone-four-indicators .row-light[data-next-dark]{opacity:0}

    #backbone-four-indicators .soft-light{filter:blur(.075px)}
    #backbone-four-indicators .logo-light{filter:drop-shadow(0 0 2px #398eff)}
    #backbone-four-indicators .memory-switch{width:7%}
    #backbone-four-indicators .memory-slot[data-dimmed]{opacity:.46}
    #backbone-four-indicators .memory-slot[data-empty]{opacity:.20}
  </style>

        shine.setAttribute('class','soft-light');
        opening(parent,light,color);
      }
      for (const image of svg.querySelectorAll('.base')) image.setAttribute('href',assets.base);
      const board = svg.querySelector('.chassis');
      const point = (x,y) => px(x)+' '+py(y);
      const bottom = 119.800 + controlDrop;
      const lowerCorner = bottom - 3;
      const outline = [
        'M '+point(217.300,62.300),'H '+px(153.200),
        'Q '+point(151.000,62.300)+' '+point(151.000,64.500),'V '+py(77.050),
        'Q '+point(151.000,78.050)+' '+point(152.250,78.050),
        'Q '+point(153.250,78.050)+' '+point(153.250,79.050),'V '+py(103.050),
        'Q '+point(153.250,104.050)+' '+point(152.250,104.050),
        'Q '+point(151.000,104.050)+' '+point(151.000,105.050),'V '+py(lowerCorner),
        'Q '+point(151.000,bottom)+' '+point(154.000,bottom),'H '+px(216.500),
        'Q '+point(219.500,bottom)+' '+point(219.500,lowerCorner),'V '+py(105.050),
        'Q '+point(219.500,104.050)+' '+point(218.250,104.050),
        'Q '+point(217.250,104.050)+' '+point(217.250,103.050),'V '+py(79.050),
        'Q '+point(217.250,78.050)+' '+point(218.250,78.050),
        'Q '+point(219.500,78.050)+' '+point(219.500,77.050),'V '+py(64.500),
        'Q '+point(219.500,62.300)+' '+point(217.300,62.300),'Z'
      ].join(' ');
      add(board,'path',{d:outline,fill:'#131313',stroke:'#393b39','stroke-width':1.2});
      for (const [x,y] of [[163.1,82.4],[201.3,74.6],[153.7,116.5+controlDrop],[217.45,114.4+controlDrop]]) {
        circle(face,x,y,1.1,'#050505',{stroke:'#363830','stroke-width':1.2});
      }
      for (const points of panel.silk) trace(face,points,'#918e7e',.105);
      panel.columns.forEach((x,col) => {
        label(face,x,86.9,'ABCDEFGH'[col],{opacity:.94});
        for (let row=0;row<8;row++) {
          const y=89.89+row*2.54;
          circle(face,x,y,.55,'#24231d',{stroke:'#c8aa62','stroke-width':1.8});
        }
      });
      for (const poly of panel.logo) {
        const points=poly.map(([x,y])=>px(x)+','+py(y)).join(' ');
        add(face,'polygon',{points,fill:'#83c3ff',class:'logo-light'});
      }
      const battery = add(face,'g',{'data-panel-status':'BATTERY'});
      const batteryX = 170.5;
      const statusPitch = 3.35;
      const batteryY = panel.status[0].y;
      const batteryLevel = 2;
      add(battery,'title',{},'Batteria · '+batteryLevel+' di 3 segmenti accesi');
      rect(battery,batteryX,batteryY,2.24,1.17,'none',
        {rx:3,stroke:'#a5b5ab','stroke-width':1.55});
      rect(battery,batteryX-1.23,batteryY,.19,.47,'#a5b5ab',{rx:1});
      for (const [i,offset] of [.57,0,-.57].entries()) {
        const active = i < batteryLevel;
        rect(battery,batteryX+offset,batteryY,.39,.65,active?'#89e8b4':'#373f39',
          {rx:1.3,color:'#89e8b4','data-battery-segment':i+1,...(active?{'data-active-light':''}:{})});
      }
      for (const [i,light] of panel.status.entries()) {
        const group=add(face,'g',{'data-panel-status':light.key});
        add(group,'title',{},light.key);
        glow(group,{...light,x:batteryX-(i+1)*statusPitch},['#d3edff','#89e8b4','#7cb8ff','#ffce77','#d9e8ff'][i],.18);
      }
      for (let bank=0;bank<2;bank++) {
        for (let row=0;row<8;row++) {
          const y = 89.89 + row*2.54;
          const index = bank*8+row;
          const lamps=panel.rows.slice(index*4,index*4+4);
          const indicator=add(face,'g',{'data-row-indicators':(bank===0?'A':'B')+(row+1)});
          for (const light of lamps) opening(indicator,light,'#373731');
          const rowNumberX=bank===0?187.8:182.7;
          label(indicator,rowNumberX,y,row+1,{opacity:.94});
          const emitter=add(indicator,'g',{class:'row-light'});
          const diodes=lamps.map((light,i) => {
            const mode=(i+1)%4;
            const diode=add(emitter,'g',{'data-mode':mode,'data-color':colors[mode]});
            glow(diode,light,colors[mode],.22);
            return {diode,mode};
          });
          const order=lamps.map((light,i) => ({x:px(light.x),mode:(i+1)%4}))
            .sort((a,b)=>a.x-b.x).map(a=>a.mode);
          dots.push({emitter,diodes,order});
          labels.push((bank === 0 ? 'A' : 'B')+(row+1));
        }
      }
      const [runControl,memoryControl] = panel.memory.map(moveControl);
      for (const [action,light] of [['run',runControl],['memory',memoryControl]]) {
        circle(face,light.x,light.y,2.04,'#191b18',{stroke:'#5e5d51','stroke-width':1.1});
        placeButton(action,light.x,light.y);
      }
      const play = add(face,'g',{color:controlLight,'data-run-light':'play'});
      const playX=px(runControl.x+.72), playY=py(runControl.y);
      add(play,'polygon',{points:[[playX-5,playY-8],[playX+8,playY],[playX-5,playY+8]].map(p=>p.join(',')).join(' '),fill:'currentColor'});
      const stop=add(face,'g',{color:controlLight,'data-run-light':'stop'});
      rect(stop,runControl.x-.73,runControl.y,.78,.78,'currentColor',{rx:1.5});
      runLights.push(play,stop);
      const lock={x:207.5,y:batteryY};
      lockLight=add(face,'g',{color:'#ffd568','data-lock-indicator':''});
      rect(lockLight,lock.x,lock.y+.23,.89,.69,'none',{rx:2.2,stroke:'currentColor','stroke-width':2.35});
      trace(lockLight,[[lock.x-.25,lock.y-.09],[lock.x-.25,lock.y-.48],[lock.x-.13,lock.y-.59],
        [lock.x+.13,lock.y-.59],[lock.x+.25,lock.y-.48],[lock.x+.25,lock.y-.09]],'currentColor',.14);
      for (const [i,key] of memoryNames.entries()) {
        const light={...memoryControl,key,x:memoryControl.x+(i===0?.78:-.78),scale:.70,width:.15};
        opening(face,light,'#75766a');
        const lamp=add(face,'g',{class:'memory-light','data-memory-light':key});
        glow(lamp,light,controlLight,.25);
        memoryLights.push(lamp);
      }
      glow(face,{...panel.supply,x:lock.x-4.7,y:lock.y},'#ffcb80',.18);
      for (const light of panel.slots.map(moveControl)) {
        opening(face,light,'#373731');
        const lamp=add(face,'g',{class:'memory-slot'});
        glow(lamp,light,'#d9e8ff',.17);
        slotLights.push(lamp);
      }
      for (const [i,light] of panel.touch.map(moveControl).entries()) {
        const {x,y} = light;
        const action=['next','mode'][i];
        circle(face,x,y,3.9,'#191c1a',{stroke:'#aaa68e','stroke-width':2.2});
        glow(face,light,action==='mode' ? controlLight : '#d9f2eb',.22);
        placeButton(action,x,y);
      }
      function placeButton(action,x,y) {
        const button=root.querySelector('[data-action="'+action+'"]');
        const view=svg.viewBox?.baseVal;
        const left=view?.x ?? 56.653;
        const width=view?.width ?? 1262.695;
        const height=view?.height ?? 1191.345;
        button.style.left=(100*(px(x)-left)/width)+'%';
        button.style.top=(100*py(y)/height)+'%';
      }
      function update() {
        const mode=states[selected];
        dots.forEach(({emitter,diodes},i) => {
          const configured = states[i];
          const dark = restoringDark===i ||
            (blinkDark && (allRows || i===selected) && !locked && memoryChoice===null);
          for (const {diode,mode} of diodes) {
            const disconnected = mode===0;
            const visible = running ? mode===configured : disconnected || (mode===configured && !dark);
            const opacity = running ? 1 : disconnected ? (configured===0 && dark ? .50 : 1) : .38;
            diode.toggleAttribute('hidden',!visible);
            diode.setAttribute('opacity',opacity);
          }
          emitter.toggleAttribute('data-next-dark',running && dark);
        });
        runLights.forEach((light,i) => {
          const active = running ? i===0 : i===1;
          light.setAttribute('opacity',active ? 1 : .30);
          light.toggleAttribute('data-active-light',active);
        });
        lockLight.setAttribute('opacity',locked ? 1 : .28);
        lockLight.toggleAttribute('data-active-light',locked);
        const modeLabel = allRows ? 'tutte le righe' : labels[selected];
        root.querySelector('[data-action="mode"]').setAttribute('aria-label',memoryChoice===null
          ? 'MODE, '+modeLabel+', '+names[mode]+'. Cambia modalità'
          : 'MODE, alterna LOAD e SAVE');
        root.querySelector('[data-action="run"]').setAttribute('aria-label',running ? 'STOP' : 'PLAY, tieni premuto per avviare');
        root.querySelector('[data-action="memory"]').setAttribute('aria-label',memoryChoice===null
          ? 'LOAD/SAVE, apri memorie' : memoryNames[memoryChoice]+', tieni premuto per confermare');

        memoryLights.forEach((lamp,i) => {
          const chosen = i === memoryChoice;
          lamp.toggleAttribute('hidden',!chosen || !confirmationOn);
          lamp.toggleAttribute('data-dimmed',!chosen);
        });
        slotLights.forEach((lamp,i) => {
          if (countdown) {
            lamp.toggleAttribute('hidden',i>=countdown.step);
            lamp.toggleAttribute('data-dimmed',false);
            lamp.toggleAttribute('data-empty',false);
            return;
          }
          const current = i === memorySlot;
          lamp.toggleAttribute('hidden',memoryChoice === null || memorySlot === null || (current && !confirmationOn));
          lamp.toggleAttribute('data-dimmed',!current);
          lamp.toggleAttribute('data-empty',memoryChoice === 0 && !savedSlots[i] && !current);
        });
        const rowStatus = locked ? (running ? 'LOCK · STOP disponibile' : 'LOCK · fermo') :
          (allRows ? 'Tutte le righe' : labels[selected])+' · '+names[states[selected]];
        const runtimeLabel = running ? 'PLAY · STOP per modificare' : 'PAUSA · tieni premuto PLAY per avviare';
        status.textContent = memoryStatus || (memoryChoice === null ? runtimeLabel+' · '+rowStatus : memoryNames[memoryChoice]+' · Memoria '+(memorySlot+1)+' · + per scorrere, MODE per cambiare, tieni premuto LOAD/SAVE per confermare');
      }
      function stopRowBlink() {
        clearTimeout(blinkTimer);
        clearTimeout(blinkEndTimer);
        blinkTimer = undefined;
        blinkDark = false;
      }

      function startRowBlink(startDark) {
        stopRowBlink();
        blinkDark = startDark;
        function advanceBlink() {
          blinkDark = !blinkDark;
          update();
          blinkTimer = setTimeout(advanceBlink,blinkDark?220:520);
        }
        blinkTimer = setTimeout(advanceBlink,startDark?160:520);
        if (!allRows) {
          blinkEndTimer = setTimeout(() => {
            stopRowBlink();
            update();
          },8000);
        }
      }

      function restartMemoryTimeout() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          memoryChoice = null;
          memorySlot = null;
          memoryStatus = '';
          if (allRows && !locked && blinkTimer===undefined) startRowBlink(false);
          update();
        }, 8000);
      }
      function validRows(value) {
        return Array.isArray(value) && value.length === states.length &&
          value.every(mode => Number.isInteger(mode) && mode >= 0 && mode < names.length);
      }

      function readSavedSlots() {
        const decode = value => {
          if (validRows(value)) return [[...value],null,null,null];
          if (!Array.isArray(value) || value.length !== 4) return null;
          return value.map(rows => validRows(rows) ? [...rows] : null);
        };
        try {
          const local = decode(JSON.parse(window.localStorage.getItem(memoryKey)));
          if (local) return local;
        } catch {}
        const saved = window.openai?.widgetState?.privateContent;
        return decode(saved?.savedSlots ?? saved?.savedRows) ?? [null,null,null,null];
      }

      function saveRows(slot) {
        savedSlots[slot] = [...states];
        try {
          window.localStorage.setItem(memoryKey,JSON.stringify(savedSlots));
        } catch {}
      }

      function persist() {
        window.openai?.setWidgetState?.({
          privateContent:{savedSlots,selected,states:[...states],running,locked,allRows},
          modelContent:{row:allRows?'tutte':labels[selected],mode:names[states[selected]],running,locked,savedSlots:savedSlots.map(Boolean)}
        })?.catch(() => {});
      }

      function restore(value) {
        if (!value) return;
        if (validRows(value.states)) states.splice(0,states.length,...value.states);
        if (Number.isInteger(value.selected) && value.selected>=0 && value.selected<states.length) selected=value.selected;
        running=value.running===true;
        const wasAllRows=allRows;
        locked=value.locked===true;
        allRows=!running && value.allRows===true;
        if (running || locked || (wasAllRows && !allRows)) stopRowBlink();
        if (allRows && !running && !locked && memoryChoice===null && blinkTimer===undefined) startRowBlink(false);
        if (!savedSlots.some(Boolean)) savedSlots=readSavedSlots();
      }

      function openMemory() {
        cancelCountdown();
        stopRowBlink();
        memoryChoice = 0;
        memorySlot = 0;
        memoryStatus = '';
        restartMemoryTimeout();
        update();
      }

      const pause = ms => new Promise(resolve => setTimeout(resolve,ms));

      async function confirmMemory() {
        const slot = memorySlot;
        const savedRows = savedSlots[slot];
        if (memoryChoice === 0 && !savedRows) {
          memoryStatus = 'Memoria '+(slot+1)+' vuota';
          restartMemoryTimeout();
          update();
          return;
        }
        applying = true;
        clearTimeout(idleTimer);
        const loading = memoryChoice === 0;
        if (!loading) saveRows(slot);
        memoryStatus = loading ? 'LOAD · ripristino in corso' : 'Configurazione salvata · '+(slot+1);
        for (let flash=0;flash<3;flash++) {
          confirmationOn = false;
          update();
          await pause(170);
          confirmationOn = true;
          update();
          await pause(170);
        }
        if (loading) {
          allRows = false;
          states.fill(0);
          update();
          await pause(220);
          for (const row of restoreOrder) {
            restoringDark = row;
            memoryStatus = 'LOAD · '+labels[row];
            update();
            await pause(75);
            states[row] = savedRows[row];
            restoringDark = null;
            update();
            await pause(85);
          }
        }
        applying = false;
        memoryChoice = null;
        memorySlot = null;
        memoryStatus = loading ? 'Configurazione caricata · '+(slot+1) : 'Configurazione salvata · '+(slot+1);
        if (allRows) startRowBlink(false);
        restartMemoryTimeout();
        persist();
        update();
      }

      function toggleLock() {
        if (applying) return;
        stopRowBlink();
        locked = !locked;
        memoryChoice = null;
        memorySlot = null;
        memoryStatus = '';
        clearTimeout(idleTimer);
        if (!running && !locked && allRows) startRowBlink(false);
        persist();
        update();
      }

      function act(action,held=false) {
        if (action === 'run') {
          if (applying || (!running && (locked || !held))) return;
          running = !running;
          memoryChoice = null;
          memorySlot = null;
          memoryStatus = '';
          clearTimeout(idleTimer);
          stopRowBlink();
          allRows = false;
          persist();
          update();
          return;
        }
        if (applying || locked || running) return;
        memoryStatus = '';
        if (memoryChoice !== null) {
          if (action === 'memory') {
            if (held) void confirmMemory();
            return;
          }
          if (held) return;
          if (action === 'mode') memoryChoice = 1-memoryChoice;
          if (action === 'next') memorySlot = (memorySlot+1)%savedSlots.length;
          restartMemoryTimeout();
          update();
          return;
        }
        if (action === 'memory') {
          if (!held) openMemory();
          return;
        }
        if (action === 'next' && held) {
          allRows = true;
          states.fill(0);
          startRowBlink(false);
        } else if (action === 'next') {
          allRows = false;
          selected = (selected+1)%states.length;
          startRowBlink(true);
        } else if (!held) {
          const order=allRows?modeOrder:dots[selected].order;
          const current=order.indexOf(states[selected]);
          const mode=order[(current+1)%order.length];
          if (allRows) states.fill(mode);
          else states[selected]=mode;
          startRowBlink(false);
        }
        persist();
        update();
      }

      const pressed = new Map();
      const longTime = 650;
      const lockTime = 1000;
      const playTime = 1200;
      const cancelTimer = press => clearTimeout(press.timer);

      function cancelCountdown(owner=countdown?.owner) {
        if (!countdown || countdown.owner!==owner) return;
        clearTimeout(countdown.timer);
        countdown = null;
        update();
      }

      function startCountdown(owner,duration,complete) {
        cancelCountdown();
        const count = {owner,step:1,timer:undefined};
        countdown = count;
        const tick = () => {
          if (count.step===slotLights.length) {
            cancelCountdown(owner);
            complete();
            return;
          }
          count.step++;
          update();
          count.timer = setTimeout(tick,duration/slotLights.length);
        };
        update();
        count.timer = setTimeout(tick,duration/slotLights.length);
      }

      function begin(action) {
        if (pressed.has(action)) return;
        const press={used:false,chord:false};
        pressed.set(action,press);
        if (!applying && pressed.has('next') && pressed.has('mode') && (action==='next' || action==='mode')) {
          for (const key of ['next','mode']) {
            const entry=pressed.get(key);
            cancelTimer(entry);
            entry.chord=true;
          }
          startCountdown('chord',lockTime,toggleLock);
        } else if (!applying && !locked && !running) {
          const complete = () => {
            press.used=true;
            act(action,true);
          };
          if (action==='run') startCountdown(action,playTime,complete);
          if (action==='next' && memoryChoice===null) press.timer=setTimeout(complete,longTime);
          if (action==='memory' && memoryChoice!==null) {
            cancelCountdown();
            press.timer=setTimeout(complete,longTime);
          }
        }
      }

      function end(action,cancelled=false) {
        const press=pressed.get(action);
        if (!press) return;
        cancelTimer(press);
        pressed.delete(action);
        cancelCountdown(press.chord?'chord':action);
        if (!cancelled && !press.used && !press.chord) act(action);
      }

      function bind(button,action) {
        const start=() => {
          if (action==='chord') { begin('next'); begin('mode'); }
          else begin(action);
        };
        const stop=cancelled => {
          if (action==='chord') { end('next',true); end('mode',true); }
          else end(action,cancelled);
        };
        let pointer=null;
        button.addEventListener('pointerdown',event => {
          if (event.button!==0 || pointer!==null) return;
          pointer=event.pointerId;
          button.setPointerCapture?.(pointer);
          start();
        });
        for (const name of ['pointerup','pointercancel','lostpointercapture']) {
          button.addEventListener(name,event => {
            if (pointer!==event.pointerId) return;
            pointer=null;
            stop(name!=='pointerup');
          });
        }
        button.addEventListener('contextmenu',event => event.preventDefault());
        for (const [name,callback] of [['keydown',start],['keyup',()=>stop(false)]]) {
          button.addEventListener(name,event => {
            if (event.code!=='Space' && event.code!=='Enter') return;
            event.preventDefault();
            if (!event.repeat) callback();
          });
        }
        button.addEventListener('click',event => {
          if (event.detail!==0) return;
          if (action!=='chord') act(action);
        });
      }

      for (const action of ['next','mode','run','memory']) {
        bind(root.querySelector('[data-action="'+action+'"]'),action);
      }
      bind(root.querySelector('[data-chord]'),'chord');
      const shortcuts={KeyN:'next',KeyM:'mode',KeyP:'run',KeyL:'memory'};
      window.addEventListener('keydown',event => {
        const action=shortcuts[event.code];
        if (!action || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        event.preventDefault();
        begin(action);
      });
      window.addEventListener('keyup',event => {
        const action=shortcuts[event.code];
        if (action) end(action);
      });
      window.addEventListener('blur',() => {
        for (const action of pressed.keys()) end(action,true);
      });
      window.addEventListener('openai:set_globals',event => {
        restore(event.detail?.globals?.widgetState?.privateContent ?? window.openai?.widgetState?.privateContent);
        update();
      });
      restore(window.openai?.widgetState?.privateContent);
      update();
    })();
  </script>
