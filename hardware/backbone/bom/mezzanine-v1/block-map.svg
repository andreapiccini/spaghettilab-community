<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" role="img" aria-labelledby="t d"><title id="t">Carrier e mezzanina AG32-LAB</title><desc id="d">Percorsi ESP bypass, segnali inline, misure e selezione USB e CAN tramite interfaccia da120contatti.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#416888"/></marker></defs><rect width="1400" height="1060" fill="#f2f6fa"/><style>text{font-family:Arial,sans-serif;fill:#17344b} .title{font-size:23px;font-weight:bold}.body{font-size:16px}.small{font-size:14px}.edge{fill:none;stroke:#416888;stroke-width:2.5;marker-end:url(#a)}</style><rect x="20" y="112" width="1360" height="385" rx="15" fill="#e5f1f7" stroke="#7591a7" stroke-width="2"/><text x="35" y="141" class="title">CARRIER</text><rect x="20" y="612" width="1360" height="385" rx="15" fill="#e9f3e8" stroke="#7591a7" stroke-width="2"/><text x="35" y="641" class="title">MEZZANINA AG32-LAB</text><rect x="530" y="12" width="350" height="77" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="545" y="41" class="title">PC / Studio / futuro MCP</text><text x="545" y="69" class="body">USB: un dispositivo alla volta</text><rect x="60" y="170" width="280" height="105" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="75" y="199" class="title">ESP32 su FlexyPin</text><text x="75" y="227" class="body">USB / Wi-Fi / Bluetooth</text><text x="75" y="250" class="body">GPIO A0–A5 + extra</text><rect x="60" y="345" width="280" height="104" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="75" y="374" class="title">U12 / U13 · bypass</text><text x="75" y="402" class="body">Bidirezionale verso le porte</text><text x="75" y="425" class="body">Funziona senza mezzanina</text><rect x="410" y="345" width="305" height="104" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="425" y="374" class="title">P1–P6 / J1–J140</text><text x="425" y="402" class="body">N_A → shunt → PORT_A</text><text x="425" y="425" class="body">Shunt sempre sulla carrier</text><rect x="790" y="170" width="290" height="105" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="805" y="199" class="title">USB + CAN selezionati</text><text x="805" y="227" class="body">U31 USB / U26 CAN TX</text><text x="805" y="250" class="body">RX CAN ai due ingressi</text><rect x="1110" y="170" width="225" height="150" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="1125" y="199" class="title">Servizi carrier</text><text x="1125" y="227" class="body">5V / 3V3 / U25</text><text x="1125" y="250" class="body">MOSFET / RGB</text><text x="1125" y="273" class="body">Terminazione CAN</text><text x="1125" y="296" class="body">automatica fisica</text><rect x="80" y="525" width="1240" height="61" rx="15" fill="#d2e4f0" stroke="#416888" stroke-width="2"/><text x="95" y="554" class="title">J10 + J11 · 2 × 60 contatti</text><text x="560" y="563" class="body">57 reti di segnale + power/GND + riserve</text><rect x="80" y="690" width="300" height="155" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="95" y="719" class="title">AG32 · CPU + fabric</text><text x="95" y="747" class="body">A0–A5 e N_A0–A5</text><text x="95" y="770" class="body">Sonde su GPIO ESP extra</text><text x="95" y="793" class="body">Inline / trigger / periferiche</text><text x="95" y="816" class="body">HDL e pin fabric da validare</text><rect x="450" y="690" width="400" height="155" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="465" y="719" class="title">Misure e stimolo</text><text x="465" y="747" class="body">ADC AG + INA226 + mux U17/U18</text><text x="465" y="770" class="body">DAC AG → R77 / U32 → U19</text><text x="465" y="793" class="body">Selezione corrente I2C / open-drain</text><text x="465" y="816" class="body">Clock, boot e debug sul modulo</text><rect x="1020" y="690" width="300" height="155" rx="15" fill="#fff" stroke="#7591a7" stroke-width="2"/><text x="1035" y="719" class="title">Flat J5 + AUX J12</text><text x="1035" y="747" class="body">GPIO ESP e bus condivisi</text><text x="1035" y="770" class="body">Contatti per moduli futuri</text><text x="1035" y="793" class="body">GPIO35–37: ponti DNP</text><text x="1035" y="816" class="body">Fissaggi / footprint da validare</text><path d="M705 89 V110 H935 V170" fill="none" stroke="#416888" stroke-width="2.5"/><text x="950" y="105" class="small">USB-C</text><polygon points="935.0,170.0 930.0,159.0 940.0,159.0" fill="#416888"/><path d="M200 275 V345" fill="none" stroke="#416888" stroke-width="2.5"/><text x="210" y="320" class="small">GPIO ESP</text><polygon points="200.0,345.0 195.0,334.0 205.0,334.0" fill="#416888"/><path d="M340 397 H410" fill="none" stroke="#416888" stroke-width="2.5"/><text x="343" y="383" class="small">bypass</text><polygon points="410.0,397.0 399.0,402.0 399.0,392.0" fill="#416888"/><path d="M340 216 H370 V525" fill="none" stroke="#416888" stroke-width="2.5"/><text x="380" y="314" class="small">A0–A5 / extra</text><polygon points="370.0,525.0 365.0,514.0 375.0,514.0" fill="#416888"/><path d="M563 449 V525" fill="none" stroke="#416888" stroke-width="2.5"/><text x="577" y="484" class="small">N_A / PORT_A</text><polygon points="563.0,525.0 558.0,514.0 568.0,514.0" fill="#416888"/><path d="M790 216 H720 V150 H340 V190" fill="none" stroke="#416888" stroke-width="2.5"/><text x="480" y="143" class="small">ramo ESP</text><polygon points="340.0,190.0 335.0,179.0 345.0,179.0" fill="#416888"/><path d="M935 275 V525" fill="none" stroke="#416888" stroke-width="2.5"/><text x="950" y="410" class="small">ramo AG USB / CAN</text><polygon points="935.0,525.0 930.0,514.0 940.0,514.0" fill="#416888"/><path d="M1110 295 H1090 V525" fill="none" stroke="#416888" stroke-width="2.5"/><text x="1120" y="465" class="small">I2C / servizi</text><polygon points="1090.0,525.0 1085.0,514.0 1095.0,514.0" fill="#416888"/><path d="M230 586 H400 V660 H230 V690" fill="none" stroke="#416888" stroke-width="2.5"/><text x="244" y="650" class="small">lati ESP e porte</text><polygon points="230.0,690.0 225.0,679.0 235.0,679.0" fill="#416888"/><path d="M650 690 V586" fill="none" stroke="#416888" stroke-width="2.5"/><text x="665" y="650" class="small">sense / DAC</text><polygon points="650.0,586.0 655.0,597.0 645.0,597.0" fill="#416888"/><path d="M1160 690 V586" fill="none" stroke="#416888" stroke-width="2.5"/><text x="1175" y="650" class="small">GPIO / bus</text><polygon points="1160.0,586.0 1165.0,597.0 1155.0,597.0" fill="#416888"/><path d="M380 763 H450" fill="none" stroke="#416888" stroke-width="2.5"/><text x="390" y="748" class="small">CPU</text><polygon points="450.0,763.0 439.0,768.0 439.0,758.0" fill="#416888"/><text x="80" y="910" class="title">Assente: ESP selezionato · Presente: priorità AG, con ritorno a ESP controllato</text><text x="80" y="947" class="body">MEZZ_OWNER: R103 verso GND sulla carrier, R109 verso3V3 sul modulo. Presenza separata su ESP GPIO38.</text><text x="35" y="1035" class="small">Solo schematico · PCB precedenti preservati · Inserimento a scheda spenta · Nessuna qualifica fisica o HDL compilato</text></svg>