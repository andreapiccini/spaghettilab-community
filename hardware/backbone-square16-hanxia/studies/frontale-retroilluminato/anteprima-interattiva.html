<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaghetti LAB — Frontale retroilluminato</title>
<style>body{margin:0;padding:20px;background:#f6f7f8}main{max-width:1000px;margin:auto}</style>
</head>
<body><main>
<section id="backbone-frontale-luminoso">
  <div class="viz-row">
    <button class="btn" type="button" data-chord>Tieni premuti NEXT + MODE</button>
    <button class="btn" type="button" data-fit aria-pressed="false">Mostra ingombri</button>
  </div>
  <div class="board">
    <svg viewBox="107.263 0 1161.475 1090.125" role="img" aria-labelledby="frontale-luminoso-compact-title">
      <title id="frontale-luminoso-compact-title">Frontale con simboli di riga retroilluminati e touch NEXT e MODE</title>
      <defs>
        <clipPath id="frontale-luminoso-center"><rect x="393" y="0" width="590" height="918"/></clipPath>
        <clipPath id="frontale-luminoso-west"><rect x="0" y="385" width="160" height="308"/><rect x="0" y="693" width="114" height="121"/></clipPath>
        <clipPath id="frontale-luminoso-east"><rect x="1216" y="385" width="160" height="308"/><rect x="1262" y="693" width="114" height="121"/></clipPath>
        <clipPath id="frontale-luminoso-usb"><rect x="18" y="119" width="142" height="172"/></clipPath>
      </defs>
      <g class="chassis"></g>
      <image class="base" width="1376" height="1450" clip-path="url(#frontale-luminoso-center)"/>
      <image class="base" width="1376" height="1450" clip-path="url(#frontale-luminoso-west)" transform="translate(130.743 2.530)"/>
      <image class="base" width="1376" height="1450" clip-path="url(#frontale-luminoso-east)" transform="translate(-130.743 2.530)"/>
      <image class="base" width="1376" height="1450" clip-path="url(#frontale-luminoso-usb)" transform="translate(130.743 0)"/>
      <g class="face"></g>
      <g class="fit" hidden></g>
    </svg>
    <button class="switch cursor-interaction" type="button" data-action="next" aria-label="NEXT, seleziona la riga successiva"></button>
    <button class="switch cursor-interaction" type="button" data-action="mode" aria-label="MODE, cambia modalità della riga"></button>
  </div>
  <p class="text-small" data-status aria-live="polite"></p>
  <style>
    #backbone-frontale-luminoso{display:grid;gap:.55rem;max-width:670px;margin:auto}
    #backbone-frontale-luminoso .board{position:relative}
    #backbone-frontale-luminoso svg{display:block;width:100%;height:auto}
    #backbone-frontale-luminoso [hidden]{display:none}
    #backbone-frontale-luminoso .row-light[data-selected]{animation:frontale-luminoso-row-blink 1.25s steps(1,end) infinite}
    @keyframes frontale-luminoso-row-blink{0%,100%{opacity:1}55%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      #backbone-frontale-luminoso .row-light[data-selected]{animation:none}
    }
    #backbone-frontale-luminoso .row-light[data-dimmed]{opacity:.42}
    #backbone-frontale-luminoso .row-light[data-next-dark]{opacity:0}
    #backbone-frontale-luminoso .memory-light[data-dimmed]{opacity:.42}
    #backbone-frontale-luminoso [data-chord]{touch-action:none}
    #backbone-frontale-luminoso .switch{touch-action:none}
    #backbone-frontale-luminoso [data-status]{text-align:center;margin:0}
    #backbone-frontale-luminoso .switch{position:absolute;transform:translate(-50%,-50%);width:12%;aspect-ratio:1;min-width:44px;border:0;background:transparent;border-radius:50%;}
    #backbone-frontale-luminoso .switch:focus-visible{outline:2px solid #f5dfad;outline-offset:3px}
    #backbone-frontale-luminoso .mark{fill:#e5dfcb;font:600 20px system-ui;text-anchor:middle;dominant-baseline:central}
    #backbone-frontale-luminoso .control-name{fill:#dfdac8;font:650 13px system-ui;letter-spacing:1.6px;text-anchor:middle}
    #backbone-frontale-luminoso .fit-note{fill:#c9efff;font:500 22px system-ui;text-anchor:middle}
    #backbone-frontale-luminoso .soft-light{filter:blur(.075px)}
    #backbone-frontale-luminoso .logo-light{filter:drop-shadow(0 0 2px #398eff)}
  </style>

          });
          label(face,bank === 0 ? 187.8 : 182.7,y,row+1,{opacity:.94});
          dots.push({emitter,diodes});
          labels.push((bank === 0 ? 'A' : 'B')+(row+1));
        }
      }
      for (const [i,light] of panel.memory.entries()) {
        circle(face,light.x,light.y,2.04,'#191b18',{stroke:'#5e5d51','stroke-width':1.1});
        opening(face,light,'#9f9a84');
        const lamp=add(face,'g',{class:'memory-light'});
        glow(lamp,light,memoryColors[i],.21);
        add(face,'text',{x:px(light.x),y:py(light.y+3.24),class:'control-name'},light.key);
        memoryLights.push(lamp);
      }
      for (const [i,[x,y]] of touches.entries()) {
        const action=['next','mode'][i];
        circle(face,x,y,3.9,'#191c1a',{stroke:'#aaa68e','stroke-width':2.2});
        glow(face,panel.touch[i],'#d9f2eb',.22);

        circle(fit,x,y,2.55,'none',{stroke:'#d9c683','stroke-width':2.15*scale,'stroke-opacity':.45,'data-electrode':''});
        const button=root.querySelector('[data-action="'+action+'"]');
        const view=svg.viewBox?.baseVal;
        const left=view?.x ?? 157.873;
        const width=view?.width ?? 1060.255;
        const height=view?.height ?? 1090.125;
        button.style.left=(100*(px(x)-left)/width)+'%';
        button.style.top=(100*py(y)/height)+'%';
      }
      for (const [i,[key,polygon]] of panel.markers.entries()) {
        const hit=panel.fp_conflicts[i];
        const traceNode=trace(fit,[...polygon,polygon[0]],hit?'#ff937e':'#7acde9',.08,
          {'data-keepout':key,'data-conflict':hit?.join(', ') ?? ''});
        add(traceNode,'title',{},hit ? key+' · '+hit.join(', ') : key);
      }

      function update() {
        dots.forEach(({emitter,diodes},i) => {
          const mode = states[i];
          const isSelected = i === selected;
          const shouldBlink = blinking && isSelected && feedback === null;
          diodes.forEach((diode,j) => diode.toggleAttribute('hidden',
            (j+1)%4 !== mode));
          emitter.toggleAttribute('data-dimmed',blinking && !isSelected);
          emitter.toggleAttribute('data-selected',shouldBlink);
          emitter.toggleAttribute('data-next-dark',restoringDark === i || isSelected && feedback === 'dark');
        });

        memoryLights.forEach((lamp,i) => {
          const chosen = i === memoryChoice;
          lamp.toggleAttribute('hidden',memoryChoice === null || (chosen && !confirmationOn));
          lamp.toggleAttribute('data-dimmed',!chosen);
        });
        const rowStatus = labels[selected]+' · '+names[states[selected]]+(editing ? ' · Modifica' : '');
        status.textContent = showFit ? 'Inviluppi 0402 sulle righe · arancione = interferenza con una piazzola'
          : memoryStatus || (memoryChoice === null ? rowStatus : memoryNames[memoryChoice]+' · MODE per confermare');
        fit.toggleAttribute('hidden',!showFit);
        toggle.setAttribute('aria-pressed',String(showFit));
        toggle.textContent = showFit ? 'Nascondi ingombri' : 'Mostra ingombri';
      }
      function restartBlinkTimeout() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          blinking = false;
          editing = false;
          memoryChoice = null;
          memoryStatus = '';
          update();
        }, 8000);
      }
      function showSelectionFeedback(kind) {
        blinking = true;
        feedback = kind;
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => {
          feedback = null;
          update();
        }, 400);
        restartBlinkTimeout();
        update();
      }
      function validRows(value) {
        return Array.isArray(value) && value.length === states.length &&
          value.every(mode => Number.isInteger(mode) && mode >= 0 && mode < names.length);
      }

      function readSavedRows() {
        try {
          const local = JSON.parse(window.localStorage.getItem(memoryKey));
          if (validRows(local)) return local;
        } catch {}
        const stored = window.openai?.widgetState?.privateContent?.savedRows;
        return validRows(stored) ? [...stored] : null;
      }

      function saveRows() {
        savedRows = [...states];
        try {
          window.localStorage.setItem(memoryKey,JSON.stringify(savedRows));
        } catch {}
        window.openai?.setWidgetState?.({
          privateContent:{savedRows},
          modelContent:{hasSavedConfiguration:true}
        })?.catch(() => {});
      }

      function openMemory() {
        if (applying || memoryChoice !== null) return;
        clearTimeout(feedbackTimer);
        blinking = false;
        editing = false;
        feedback = null;
        memoryChoice = savedRows ? 0 : 1;
        memoryStatus = '';
        restartBlinkTimeout();
        update();
      }

      const pause = ms => new Promise(resolve => setTimeout(resolve,ms));

      async function confirmMemory() {
        if (memoryChoice === 0 && !savedRows) {
          memoryStatus = 'Nessuna configurazione salvata';
          restartBlinkTimeout();
          update();
          return;
        }
        applying = true;
        clearTimeout(idleTimer);
        const loading = memoryChoice === 0;
        if (!loading) saveRows();
        memoryStatus = loading ? 'LOAD · ripristino in corso' : 'Configurazione salvata';
        for (let flash=0;flash<3;flash++) {
          confirmationOn = false;
          update();
          await pause(170);
          confirmationOn = true;
          update();
          await pause(170);
        }
        if (loading) {
          states.fill(0);
          update();
          await pause(220);
          for (const row of restoreOrder) {
            restoringDark = row;
            memoryStatus = 'LOAD · '+labels[row];
            update();
            await pause(75);
            states[row] = savedRows[row];
            restoringDark = null;
            update();
            await pause(85);
          }
        }
        applying = false;
        memoryChoice = null;
        memoryStatus = loading ? 'Configurazione caricata' : 'Configurazione salvata';
        restartBlinkTimeout();
        update();
      }

      function act(action) {
        if (applying) return;
        memoryStatus = '';
        if (memoryChoice !== null) {
          if (action === 'mode') {
            void confirmMemory();
          } else {
            memoryChoice = 1-memoryChoice;
            restartBlinkTimeout();
            update();
          }
          return;
        }
        if (action === 'next') {
          selected = (selected+1)%states.length;
          showSelectionFeedback('dark');
        } else if (!editing) {
          editing = true;
          showSelectionFeedback('dark');
        } else {
          states[selected] = (states[selected]+1)%names.length;
          showSelectionFeedback('color');
        }
      }

      function chordHeld() {
        const actions = [...pressTokens.values()];
        return actions.includes('both') || (actions.includes('next') && actions.includes('mode'));
      }

      function hold(token,action) {
        if (applying || pressTokens.has(token)) return;
        consumedPresses.delete(token);
        pressTokens.set(token,action);
        if (!chordHeld() || chordTimer !== undefined) return;
        chordTimer = setTimeout(() => {
          chordTimer = undefined;
          for (const pressed of pressTokens.keys()) consumedPresses.add(pressed);
          openMemory();
        },650);
      }

      function release(token) {
        if (!pressTokens.delete(token)) return;
        if (!chordHeld()) {
          clearTimeout(chordTimer);
          chordTimer = undefined;
        }
      }

      for (const [action,button] of [
        ['next',root.querySelector('[data-action="next"]')],
        ['mode',root.querySelector('[data-action="mode"]')],
        ['both',chordButton],
      ]) {
        const token = 'pointer-'+action;
        button.addEventListener('pointerdown',event => {
          if (event.button !== 0) return;
          button.setPointerCapture?.(event.pointerId);
          hold(token,action);
        });
        for (const event of ['pointerup','pointercancel','lostpointercapture']) {
          button.addEventListener(event,() => release(token));
        }
        if (action !== 'both') {
          button.addEventListener('click',() => {
            if (!consumedPresses.delete(token)) act(action);
          });
        }
      }
      chordButton.addEventListener('keydown',event => {
        if (event.key !== ' ' && event.key !== 'Enter') return;
        event.preventDefault();
        hold('shortcut','both');
      });
      chordButton.addEventListener('keyup',() => release('shortcut'));
      chordButton.addEventListener('blur',() => release('shortcut'));
      const shortcuts = {KeyN:'next',KeyM:'mode'};
      window.addEventListener('keydown',event => {
        const action = shortcuts[event.code];
        if (!action || event.altKey || event.ctrlKey || event.metaKey) return;
        event.preventDefault();
        if (!event.repeat) hold(event.code,action);
      });
      window.addEventListener('keyup',event => {
        const action = shortcuts[event.code];
        if (!action || !pressTokens.has(event.code)) return;
        release(event.code);
        if (!consumedPresses.delete(event.code)) act(action);
      });
      window.addEventListener('blur',() => {
        for (const token of pressTokens.keys()) release(token);
      });
      window.addEventListener('openai:set_globals',() => {
        if (savedRows === null) savedRows = readSavedRows();
      });
      toggle.addEventListener('click',() => {
        showFit=!showFit;
        update();
      });
      update();
    })();
  </script>
</section>
</main></body></html>
