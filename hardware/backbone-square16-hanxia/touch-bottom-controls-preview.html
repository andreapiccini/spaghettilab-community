    const data=JSON.parse(root.querySelector('[data-images]').textContent);

    const targets=[{"id": "play", "x": 216.06, "y": 1042.12, "w": 65, "h": 55}, {"id": "debug", "x": 325.47, "y": 1042.12, "w": 65, "h": 55}, {"id": "load", "x": 740.97, "y": 1021.35, "w": 65, "h": 45}, {"id": "save", "x": 821.3, "y": 1021.35, "w": 65, "h": 45}, {"id": "delete", "x": 901.63, "y": 1021.35, "w": 65, "h": 45}, {"id": "s0", "x": 740.97, "y": 1090.6, "w": 48, "h": 45}, {"id": "s1", "x": 821.3, "y": 1090.6, "w": 48, "h": 45}, {"id": "s2", "x": 901.63, "y": 1090.6, "w": 48, "h": 45}, {"id": "s3", "x": 981.96, "y": 1090.6, "w": 48, "h": 45}, {"id": "u1", "x": 189.74, "y": 503.35, "w": 69, "h": 69}, {"id": "u2", "x": 270.07, "y": 503.35, "w": 69, "h": 69}, {"id": "u3", "x": 350.4, "y": 503.35, "w": 69, "h": 69}, {"id": "u4", "x": 189.74, "y": 583.69, "w": 69, "h": 69}, {"id": "u5", "x": 270.07, "y": 583.69, "w": 69, "h": 69}, {"id": "u6", "x": 350.4, "y": 583.69, "w": 69, "h": 69}, {"id": "clearall", "x": 981.96, "y": 1021.35, "w": 69, "h": 69}];

    for(const [k,src]of entries){const im=new Image();images[k]=im;im.onload=()=>{ready++;draw()};im.src=src;}

    function stop(){mode='STOPPED';action=null;note='STOPPED — all rows disconnected';}
    function command(k){
      if(/^u[1-6]$/.test(k)){lastUser='T'+k.slice(1);note=lastUser+' — programmable user touch, no action assigned';}

      draw();save();
    }
    function selectSlot(i,long=false){
      slot=i;
      if(action==='save'){slots[i]=rows.slice();note='Saved in slot '+(i+1);action=null;}
      else if(action==='load'){if(!slots[i])note='Slot '+(i+1)+' empty — configuration unchanged';else{rows=slots[i].slice();stop();note='Slot '+(i+1)+' loaded — press Play to apply';}}

      draw();save();
    }

      summary.textContent=mode+' · '+note;

      for(let i=0;i<16;i++)if(rows[i]){ctx.globalAlpha=mode==='RUNNING'?1:.65;ctx.drawImage(images['r'+(i*3+rows[i]-1)],0,0);}ctx.globalAlpha=1;
