  <script>
  (()=>{
    const root=document.getElementById('touch-bottom-controls'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),summary=root.querySelector('[data-summary]');
    const data=JSON.parse(root.querySelector('[data-images]').textContent);
    let ready=0,images={},mode='STOPPED',debug=false,action=null,slot=0,rows=Array.from({length:16},(_,i)=>[1,2,3,0][i%4]),slots=Array(4).fill(null),note='Choose a row or a command',held=null,holdAt=0,timer=null,handled=false;
    const entries=[['base',data.base],['fixed',data.fixed],...data.rows.map((v,i)=>['r'+i,v]),...Object.entries(data.commands),...data.slots.map((v,i)=>['s'+i,v])];
    const targets=[{"id": "play", "x": 216.06, "y": 1042.12, "w": 65, "h": 55}, {"id": "debug", "x": 325.47, "y": 1042.12, "w": 65, "h": 55}, {"id": "load", "x": 778.37, "y": 1014.42, "w": 65, "h": 45}, {"id": "save", "x": 862.85, "y": 1014.42, "w": 65, "h": 45}, {"id": "delete", "x": 947.34, "y": 1014.42, "w": 65, "h": 45}, {"id": "s0", "x": 774.21, "y": 1076.74, "w": 48, "h": 45}, {"id": "s1", "x": 832.38, "y": 1076.74, "w": 48, "h": 45}, {"id": "s2", "x": 890.55, "y": 1076.74, "w": 48, "h": 45}, {"id": "s3", "x": 948.72, "y": 1076.74, "w": 48, "h": 45}];
    const sources={PLAY:[198,637],STOP:[288,637],DEBUG:[379,637],LOAD:[797,637],SAVE:[887,637],DELETE:[977,637]};
    for(const [k,src]of entries){const im=new Image();images[k]=im;im.onload=()=>{ready++;draw()};im.src=src;}
    function stop(){mode='STOPPED';action=null;note='STOPPED — all rows disconnected';}
    function command(k){
      if(k==='stop')stop();
      else if(k==='play'){mode=mode==='RUNNING'?'PAUSED':'RUNNING';action=null;note=mode==='PAUSED'?'PAUSED — row outputs remain powered':'RUNNING — working configuration applied';}
      else if(k==='debug'){debug=!debug;note=debug?'DEBUG selected — measurements require the optional measurement board':'DEBUG off';}
      else if(k==='load'||k==='save'||k==='delete'){action=action===k?null:k;note=action?(k.toUpperCase()+' — '+(k==='delete'?'hold a slot for 2 seconds':'touch slot 1–4')):'Cancelled';}
      draw();save();
    }
    function selectSlot(i,long=false){
      slot=i;
      if(action==='save'){slots[i]=rows.slice();note='Saved in slot '+(i+1);action=null;}
      else if(action==='load'){if(!slots[i])note='Slot '+(i+1)+' empty — configuration unchanged';else{rows=slots[i].slice();stop();note='Slot '+(i+1)+' loaded — press Play to apply';}}
      else if(action==='delete'){if(long){slots[i]=null;action=null;note='Slot '+(i+1)+' deleted — working configuration retained';}else note='Hold slot '+(i+1)+' for 2 seconds to delete';}
      else note='Slot '+(i+1)+(slots[i]?' saved':' empty');
      draw();save();
    }
    function draw(){
      summary.textContent=mode+' · '+note;
      for(const b of root.querySelectorAll('[data-slot]'))b.setAttribute('aria-pressed',String(+b.dataset.slot===slot));
      if(ready!==entries.length)return;
      const width=Math.max(280,root.clientWidth),height=width*950/1176,dpr=devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(width/1176*dpr,0,0,width/1176*dpr,0,-230*width/1176*dpr);
      ctx.clearRect(0,230,1176,950);ctx.globalAlpha=1;ctx.drawImage(images.base,0,0);ctx.drawImage(images.fixed,0,0);
      for(let i=0;i<16;i++)if(rows[i]){ctx.globalAlpha=mode==='RUNNING'?1:.65;ctx.drawImage(images['r'+(i*3+rows[i]-1)],0,0);}ctx.globalAlpha=1;
      for(const [key,on]of [['PLAY',mode!=='STOPPED'],['DEBUG',debug],['LOAD',action==='load'],['SAVE',action==='save'],['DELETE',action==='delete']]){ctx.globalAlpha=on?1:.2;ctx.drawImage(images[key],0,0);}
      for(let i=0;i<4;i++){ctx.globalAlpha=i===slot?1:slots[i]?.5:.2;ctx.drawImage(images['s'+i],0,0);}ctx.globalAlpha=1;
    }
    function save(){window.openai?.setWidgetState?.({modelContent:{proposal:'bottom grouped clickable touch commands, one play-pause zone',board_mm:[78,57.2],runtime:mode,debug_selected:debug,action,slot:slot+1,saved_slots:slots.map(Boolean),global_touch_zones:9,touch_controller_count:2,second_controller_proposal:'BS8116A-3 on separate software I2C',logo_emitters_current:4,logo_fit_verified:false,LED_driver_channels_current:65,LED_driver_channels_free_current:79,physical_buttons:0,row_glyph_angle_deg:45,row_glyph_PCB_updated:true,PCB_modified:true,firmware_implemented:false},privateContent:{kind:'touch-bottom-v1',rows,slots,slot,debug,mode,action,note}})?.catch?.(()=>{});}
    function begin(id){held=id;holdAt=performance.now();handled=false;if(id==='play'||/^s[0-3]$/.test(id)&&action==='delete')timer=setTimeout(()=>{handled=true;if(id==='play'){stop();draw();save();}else selectSlot(+id.slice(1),true);},2000);}
    function end(){clearTimeout(timer);if(held&&!handled){if(/^s[0-3]$/.test(held))selectSlot(+held.slice(1));else if(held.startsWith('r')){const i=+held.slice(1);rows[i]=(rows[i]+1)%4;note=(i<8?'A':'B')+(i%8+1)+' · '+['Hi-Z','3.3V','GND','MCU'][rows[i]];draw();save();}else command(held);}held=null;}
    function cancel(){clearTimeout(timer);held=null;}
    for(const b of root.querySelectorAll('[data-action],[data-slot]')){
      const id=b.dataset.action??('s'+b.dataset.slot);
      b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);begin(id)});b.addEventListener('pointerup',end);b.addEventListener('pointercancel',cancel);
      b.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();if(!e.repeat)begin(id)}});b.addEventListener('keyup',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();end()}});
    }
    canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1176/r.width,y=(e.clientY-r.top)*950/r.height+230;let t=targets.find(t=>Math.abs(t.x-x)<t.w/2&&Math.abs(t.y-y)<t.h/2);if(!t){const row=Math.round((y-715.12)/35.18);if(row>=0&&row<8&&Math.abs(y-715.12-row*35.18)<15){if(x>330&&x<375)t={id:'r'+row};if(x>777&&x<825)t={id:'r'+(row+8)};}}if(t){canvas.setPointerCapture(e.pointerId);begin(t.id);}});canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',cancel);window.addEventListener('blur',cancel);
    function restore(s){if(!s||s.kind!=='touch-bottom-v1')return;if(Array.isArray(s.rows)&&s.rows.length===16&&s.rows.every(v=>Number.isInteger(v)&&v>=0&&v<4))rows=s.rows.slice();if(Array.isArray(s.slots)&&s.slots.length===4)slots=s.slots.map(p=>Array.isArray(p)&&p.length===16?p.slice():null);if(Number.isInteger(s.slot)&&s.slot>=0&&s.slot<4)slot=s.slot;debug=!!s.debug;if(['RUNNING','PAUSED','STOPPED'].includes(s.mode))mode=s.mode;if([null,'load','save','delete'].includes(s.action))action=s.action;note=s.note||note;draw();}
    restore(window.openai?.widgetState?.privateContent);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.privateContent));new ResizeObserver(draw).observe(root);draw();
  })();
