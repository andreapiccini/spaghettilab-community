; CORE ESP32-S3: USB protobuf/COBS to the PC. Flash/update of C3 is UART on the
; CAN PHY (TWAI uninstalled). Runtime ping/reboot is TWAI. Pins from KiCad PCBs.

[platformio]
default_envs = core
src_dir = src

[env]
; Official platformio/platform-espressif32 stalled on arduino-esp32 2.0.17
; (IDF 4.4), which lacks esp_now_recv_info_t and driver/rmt_tx.h that this
; codebase's espnow_receiver.cpp / sk6812_rmt.cpp are written against. Pin
; the pioarduino community fork instead, which tracks arduino-esp32 3.x/IDF5.
; https://github.com/pioarduino/platform-espressif32/releases/tag/55.03.311
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:backbone]
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = partitions/backbone_4mb_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I src/common
    -I src/backbone
lib_compat_mode = off
lib_deps =
    https://github.com/stm32duino/NFC-RFAL.git#8926e585ae7966c8f6e9f8a784a31d0657188174
    https://github.com/stm32duino/ST25R200.git#3c6c30a781badf2d055fd5ff4656633366bfa8c1
build_src_filter =
    +<common/>
    +<backbone/>
    -<core/>

; Conservative recovery image. It keeps TWAI and boot-time UART SLUP active,
; but never starts the automatic NFC IRQ/LPCD state machine. NFC remains
; available through explicit diagnostic commands only.
[env:backbone-recovery]
extends = env:backbone
build_flags =
    ${env:backbone.build_flags}
    -DBACKBONE_SAFE_RECOVERY=1

[env:core]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -I src/common
    -I src/core
build_src_filter =
    +<common/>
    +<core/>
    -<backbone/>
