# BLE-only Core V1 image. Mutually exclusive with the default Wi-Fi image.
# Build with: make build-ble
#
# React Flow talks Protocol V1 over BLE. USB Shell remains. Wi-Fi, MQTT, IP OTA,
# and the TLS remote console are not in this artifact.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=1
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_EXT_ADV=n
CONFIG_BT_DEVICE_NAME="SpaghettiLAB"
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=3
CONFIG_ESP32_BT_CTLR_ADV_DUP_FILT_MAX=8

CONFIG_WIFI=n
CONFIG_WIFI_ESP32=n
CONFIG_MQTT_LIB=n
CONFIG_NETWORKING=n
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_NET_SOCKETS_ENABLE_DTLS=n
CONFIG_NET_MGMT=n
CONFIG_NET_MGMT_EVENT=n
CONFIG_NET_DHCPV4=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_L2_WIFI_SHELL=n

CONFIG_SPAGHETTI_CONNECTIVITY_BOOT_LOW_ENERGY=y
CONFIG_SPAGHETTI_WIFI_PROFILE_AUTO_CONNECT=n
