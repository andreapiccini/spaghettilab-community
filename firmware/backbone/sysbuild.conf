# Build MCUboot and the Spaghetti LAB application as one system.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Espressif defaults to overwrite-only, which cannot roll back a failed image.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Development signing key. The private PEM is generated locally and ignored by Git.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/opt/zephyrproject/app/.keys/mcuboot-dev-ecdsa-p256.pem"
