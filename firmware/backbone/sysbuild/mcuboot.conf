# Keep normal boot output useful without enabling verbose bootloader diagnostics.
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# Reject an older signed image after a newer image has been accepted.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Board defconfig enables SPI for the ST25R100. MCUboot does not talk to it
# and cannot compile the ESP32 SPI driver without multithreading.
CONFIG_SPI=n
