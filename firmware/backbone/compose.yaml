services:
  dev:
    build:
      context: .
      args:
        ZEPHYR_DOCKER_TAG: ${ZEPHYR_DOCKER_TAG:-v0.29.2}
        ZEPHYR_VERSION: ${ZEPHYR_VERSION:-v4.4.0}
    image: esp32c3-zephyr-dev:${ZEPHYR_VERSION:-v4.4.0}
    working_dir: /opt/zephyrproject/app
    environment:
      BOARD: ${BOARD:-spaghettilab_core_v1/esp32c3}
      CCACHE_DIR: /home/user/.cache/ccache
    volumes:
      - .:/opt/zephyrproject/app
      - zephyr-ccache:/home/user/.cache/ccache
    stdin_open: true
    tty: true

volumes:
  zephyr-ccache:
