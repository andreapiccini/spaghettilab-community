# Dedicated NFC product; shared code and signing key, separate build directory.
CONFIG_SPAGHETTI_NFC_MODULE=y
CONFIG_SPAGHETTI_NFC=y
CONFIG_SPAGHETTI_FIELD_UPDATE=y
CONFIG_SPAGHETTI_FIELD_UPDATE_CAN=y
CONFIG_SPAGHETTI_FIELD_UPDATE_ESPNOW=n
CONFIG_SPAGHETTI_FIELD_UPDATE_STACK_SIZE=3072
# No radio is needed by this CAN-only product.
CONFIG_WIFI=n
CONFIG_WIFI_ESP32=n
CONFIG_NET_L2_WIFI_SHELL=n
